version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - TASK_SERVICE_URL=http://task-service:8003
      - ANALYTICS_SERVICE_URL=http://analytics-service:8004
    depends_on:
      - auth-service
      - task-service
      - analytics-service
    networks:
      - taskboard-network

  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./auth.db
      - JWT_SECRET=your-jwt-secret-key-min-32-chars-change
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - auth-data:/app
    networks:
      - taskboard-network

  task-service:
    build: ./services/task-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=sqlite:///./task.db
      - JWT_SECRET=your-jwt-secret-key-min-32-chars-change
      - ALGORITHM=HS256
    volumes:
      - task-data:/app
    networks:
      - taskboard-network

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8004:8004"
    environment:
      - TASK_SERVICE_URL=http://task-service:8003
      - JWT_SECRET=your-jwt-secret-key-min-32-chars-change
      - ALGORITHM=HS256
    depends_on:
      - task-service
    networks:
      - taskboard-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - gateway
    networks:
      - taskboard-network

networks:
  taskboard-network:
    driver: bridge

volumes:
  auth-data:
  task-data:
